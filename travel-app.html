<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Travel</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ECE7DC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Travel">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-192.png">
<link rel="shortcut icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#ECE7DC; --ink:#16130C; --muted:#756D5E; --faint:#A39A89;
    --line:rgba(22,19,12,.12); --line-strong:rgba(22,19,12,.22); --card:#FFFFFF;
    --cobalt:#1E40FF; --coral:#FF5A35; --amber:#E89A2B; --green:#1B8A57; --purple:#7C4DFF;
    --cream:#F4EFE4; --soft:#F6F2E9;
    --flight:var(--cobalt); --hotel:var(--green); --car:var(--amber); --ride:var(--purple); --rail:var(--coral); --other:var(--muted);
    --display:'Bricolage Grotesque',sans-serif; --body:'Archivo',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{background:var(--canvas);color:var(--ink);font-family:var(--body);line-height:1.45;-webkit-font-smoothing:antialiased;padding:max(40px,env(safe-area-inset-top)) clamp(20px,5vw,72px) calc(80px + env(safe-area-inset-bottom))}
  ::selection{background:var(--coral);color:#fff}
  .wrap{max-width:1140px;margin:0 auto}
  @keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes floatPlane{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(6px,-6px) rotate(-4deg)}}
  @keyframes overlayIn{from{opacity:0}to{opacity:1}}
  @keyframes sheetIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes dashFlow{to{background-position:-16px 0}}

  /* header */
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;animation:riseIn .6s ease both}
  .brand h1{font-family:var(--display);font-weight:800;font-size:clamp(54px,9vw,104px);line-height:.82;letter-spacing:-.035em;margin:0 0 12px}
  .brand p{font-size:16px;color:var(--muted);margin:0;max-width:440px;line-height:1.45}
  .ctl{display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap}
  .status{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.14em;padding:7px 12px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;text-transform:uppercase}
  .status .dot{width:6px;height:6px;border-radius:50%;display:inline-block;background:currentColor}
  .status.local{color:var(--muted);background:rgba(117,109,94,.1);border:1px solid rgba(117,109,94,.24)}
  .status.synced{color:var(--green);background:rgba(27,138,87,.1);border:1px solid rgba(27,138,87,.28)}
  .status.offline{color:var(--amber);background:rgba(232,154,43,.12);border:1px solid rgba(232,154,43,.32)}
  .btn{font-family:var(--body);font-weight:600;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);padding:9px 18px;border-radius:999px;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
  .btn:hover{box-shadow:0 6px 18px rgba(22,19,12,.1);transform:translateY(-1px)}
  .btn.solid{background:var(--ink);color:var(--cream);border-color:var(--ink)}
  .btn.solid:hover{transform:translateY(-2px)}

  /* hero */
  .hero{margin:34px 0 0;border-radius:28px;overflow:hidden;background:var(--ink);color:var(--cream);display:grid;grid-template-columns:1.25fr 1fr;min-height:320px;box-shadow:0 30px 60px -28px rgba(22,19,12,.55);animation:riseIn .7s ease .08s both}
  .hero-text{padding:36px 40px;display:flex;flex-direction:column;position:relative}
  .hero-top{display:flex;align-items:center;gap:12px;margin-bottom:auto}
  .pill-next{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.2em;background:var(--coral);color:#fff;padding:6px 12px;border-radius:999px}
  .hero-date{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:rgba(244,239,228,.6)}
  .hero-count{display:flex;align-items:baseline;gap:18px;margin:28px 0 4px}
  .hero-count .num{font-family:var(--display);font-weight:800;font-size:clamp(80px,12vw,128px);line-height:.8;letter-spacing:-.04em}
  .hero-count .lab{padding-bottom:10px}
  .hero-count .lab div{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.05}
  .hero-count .lab .city{color:var(--coral)}
  .route{display:flex;align-items:center;gap:14px;margin:18px 0 26px}
  .route .code{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em}
  .route .line{flex:1;height:2px;background-image:linear-gradient(90deg,rgba(244,239,228,.5) 50%,transparent 50%);background-size:14px 2px;animation:dashFlow 1s linear infinite}
  .plane{color:var(--coral)}
  .plane.float{animation:floatPlane 3s ease-in-out infinite}
  .hero-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .hero-btn{font-family:var(--body);font-weight:700;font-size:15px;color:var(--ink);background:var(--cream);border:none;padding:13px 24px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .15s ease}
  .hero-btn:hover{transform:translateY(-2px)}
  .hero-cap{font-family:var(--body);color:rgba(244,239,228,.65);font-size:14px}
  .hero-photo{position:relative}
  .hero-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .hero-fade{position:absolute;inset:0;background:linear-gradient(90deg,var(--ink) 0%,rgba(22,19,12,.35) 35%,transparent 70%);pointer-events:none}

  /* stats */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:16px;animation:riseIn .7s ease .14s both}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 24px}
  .stat .n{font-family:var(--display);font-weight:800;font-size:44px;line-height:.9;letter-spacing:-.03em}
  .stat .l{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:8px}

  /* tabs */
  .tabs{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px;width:fit-content;margin-top:30px}
  .tab{font-family:var(--body);font-weight:600;font-size:14px;padding:9px 20px;border-radius:999px;cursor:pointer;border:none;background:transparent;color:var(--muted);transition:background .18s ease,color .18s ease;display:inline-flex;align-items:center;gap:8px}
  .tab.active{background:var(--ink);color:var(--cream)}
  .tab .cnt{opacity:.55;font-family:var(--mono);font-size:12px}

  /* list section */
  .section{margin-top:22px}
  .listhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .listhead h2{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:500}
  .add{font-family:var(--body);font-weight:700;font-size:13px;color:var(--cobalt);background:rgba(30,64,255,.08);border:none;padding:9px 16px;border-radius:999px;cursor:pointer;transition:background .15s ease}
  .add:hover{background:rgba(30,64,255,.16)}

  /* trip card */
  .trip{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 18px 40px -32px rgba(22,19,12,.5);margin-bottom:16px}
  .trip-head{display:grid;grid-template-columns:200px 1fr;position:relative}
  .photo-edit{position:absolute;top:10px;left:10px;z-index:2;width:34px;height:34px;border-radius:50%;border:none;background:rgba(22,19,12,.55);color:#fff;font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);transition:background .15s}
  .photo-edit:hover{background:rgba(22,19,12,.82)}
  .photo-prev{width:100%;height:150px;object-fit:cover;border-radius:14px;border:1px solid var(--line);background:var(--soft);margin-bottom:12px;display:block}
  .trip-photo{width:100%;height:100%;min-height:168px;object-fit:cover}
  .trip-body{padding:24px 26px}
  .trip-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .trip-top>div:first-child{flex:1;min-width:0}            /* let the route/title shrink + wrap instead of pushing the buttons off-screen */
  .trip-route{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
  .trip-route .code{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;overflow-wrap:anywhere;min-width:0}
  .trip h3{font-family:var(--display);font-weight:700;font-size:20px;margin:0 0 12px;overflow-wrap:anywhere}
  .trip h3.empty{color:var(--faint);font-weight:400}
  .chips{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .c-date{font-family:var(--mono);font-size:13px;color:var(--muted)}
  .c-dur{font-family:var(--mono);font-size:11px;font-weight:700;background:var(--ink);color:var(--cream);padding:5px 10px;border-radius:999px}
  .c-badge{font-family:var(--mono);font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px}
  .c-badge.soon{background:rgba(30,64,255,.1);color:var(--cobalt)}
  .c-badge.live{background:rgba(27,138,87,.12);color:var(--green)}
  .c-badge.done{background:rgba(22,19,12,.06);color:var(--faint)}
  .card-acts{display:flex;gap:8px;flex-shrink:0}
  .mini{font-family:var(--body);font-weight:600;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);padding:8px 16px;border-radius:999px;cursor:pointer}
  .mini:hover{background:var(--soft)}
  .mini.del{color:var(--coral);border-color:rgba(255,90,53,.3)}
  .mini.del:hover{background:rgba(255,90,53,.08)}
  .tripnote{margin:14px 26px 0;font-size:13px;color:var(--muted);background:var(--soft);border:1px solid var(--line);border-left:3px solid var(--line-strong);border-radius:0 10px 10px 0;padding:10px 13px;white-space:pre-wrap}

  /* toggle + timeline */
  .toggle{width:100%;display:flex;align-items:center;justify-content:space-between;padding:14px 26px;background:#F8F5EE;border:none;border-top:1px solid var(--line);cursor:pointer;margin-top:16px}
  .toggle .lbl{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--muted)}
  .toggle .sq{width:8px;height:8px;border-radius:2px;display:inline-block}
  .toggle .rgt{font-family:var(--body);font-size:13px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px}
  .toggle .caret{font-size:11px}
  .itin{padding:8px 26px 22px;display:none}
  .trip.open .itin{display:block}
  .plan{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
  .plan .dotwrap{position:relative;display:flex;justify-content:center}
  .plan .dot{width:14px;height:14px;border-radius:50%}
  .plan .ttl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .plan .nm{font-family:var(--display);font-weight:700;font-size:16px}
  .plan .type{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;padding:3px 8px;border-radius:999px;text-transform:uppercase}
  .plan{cursor:pointer}
  .plan>div{min-width:0}
  .plan .ttl .nm{overflow-wrap:anywhere}
  .plan .sub{font-size:13px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .plan .pmeta{display:flex;align-items:center;gap:12px}
  .plan .when{font-family:var(--mono);font-size:13px;color:var(--ink);white-space:nowrap}
  .plan .x{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;font-size:14px;line-height:1}
  .plan .x:hover{color:var(--coral);border-color:rgba(255,90,53,.35)}
  .itin .empty{color:var(--faint);font-size:13px;padding:6px 0 4px}
  .addplan{margin-top:16px;font-family:var(--body);font-weight:700;font-size:13px;color:var(--cobalt);background:rgba(30,64,255,.08);border:none;padding:10px 18px;border-radius:999px;cursor:pointer}
  .addplan.ical{margin-left:8px;color:var(--ink);background:var(--soft)}
  .destinfo{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;empty-cells:hide}
  .destinfo:empty{display:none}
  .destinfo .di{font-family:var(--mono);font-size:12px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
  .destinfo .di em{color:var(--faint);font-style:normal}
  /* world map ("been there") */
  .map-loading{padding:48px 0;text-align:center;color:var(--muted);font-family:var(--mono);font-size:13px}
  .map-wrap{background:#F4F0E6;border:1px solid var(--line);border-radius:18px;padding:10px;overflow:hidden}
  .worldmap{width:100%;height:auto;display:block}
  .worldmap .mk text{font-family:var(--mono)}
  .map-stat{margin:16px 2px 10px;font-family:var(--body);font-size:15px;color:var(--muted)}
  .map-stat b{color:var(--ink);font-family:var(--display);font-weight:700}
  .map-chips{display:flex;flex-wrap:wrap;gap:8px}
  .mc{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px}
  .mc .fl{font-size:17px;line-height:1}
  .mc .nm{font-weight:600;color:var(--ink)}
  .mc .ct{font-family:var(--mono);color:var(--coral);font-weight:700;font-size:13px}
  /* days away by year (calendar tab) */
  .yr-wrap{margin:20px 0 4px}
  .yr-lh{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .yr{margin-bottom:12px}
  .yr-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
  .yr-y{font-family:var(--display);font-weight:700;font-size:16px;color:var(--ink)}
  .yr-n{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .yr-bar{height:8px;background:var(--soft);border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .yr-bar span{display:block;height:100%;background:var(--cobalt);border-radius:999px}
  .yr-top{cursor:pointer;user-select:none}
  .yr-caret{display:inline-block;font-size:11px;color:var(--faint);transition:transform .15s ease}
  .yr.open .yr-caret{transform:rotate(90deg)}
  .yr-detail{display:none;margin-top:8px}
  .yr.open .yr-detail{display:block}
  .yr-trip{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:5px 0;border-top:1px solid var(--line)}
  .yr-tr{color:var(--ink);font-weight:600}
  .yr-td{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
  .yr-hint{font-family:var(--body);text-transform:none;letter-spacing:0;color:var(--faint);font-size:11px}
  .addplan:hover{background:rgba(30,64,255,.16)}

  /* wishlist */
  .wish{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px 28px;box-shadow:0 18px 40px -32px rgba(22,19,12,.5);margin-bottom:16px}
  .wish .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
  .wish h3{font-family:var(--display);font-weight:800;font-size:26px;margin:0 0 14px;letter-spacing:-.02em}
  .wcrit{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .wchip{font-family:var(--mono);font-size:12px;background:#F4F0E7;border:1px solid var(--line);padding:6px 12px;border-radius:999px}
  .wchip b{color:var(--cobalt)}
  .wchip.accent{font-weight:700;color:var(--cobalt);background:rgba(30,64,255,.08);border-color:transparent}
  .wish .note{color:var(--muted);margin:0;line-height:1.5;max-width:460px}
  .watch{display:inline-flex;align-items:center;gap:9px;margin-top:20px;font-family:var(--body);font-weight:700;font-size:14px;color:var(--cream);background:var(--ink);border:none;padding:12px 22px;border-radius:999px;cursor:pointer;text-decoration:none;transition:transform .15s ease}
  .watch:hover{transform:translateY(-2px)}

  /* empty states */
  .empty-state{background:var(--card);border:1px dashed var(--line);border-radius:24px;padding:64px 24px;text-align:center}
  .empty-state .h{font-family:var(--display);font-weight:700;font-size:22px;margin-bottom:8px}
  .empty-state p{color:var(--muted);margin:0 auto 18px;max-width:360px;line-height:1.5}

  /* modal */
  .scrim{position:fixed;inset:0;background:rgba(22,19,12,.5);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:24px;z-index:50;animation:overlayIn .2s ease both}
  .scrim.show{display:flex}
  .modal{width:100%;max-width:min(94vw,720px);background:var(--card);border-radius:26px;padding:32px 34px;box-shadow:0 40px 90px -30px rgba(0,0,0,.6);animation:sheetIn .28s cubic-bezier(.2,.8,.2,1) both;max-height:92vh;overflow:auto}
  .modal h3{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--ink);margin:0 0 24px}
  .modal h4{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin:22px 0 12px}
  .field{margin-bottom:18px}
  .field label{display:block;font-weight:600;font-size:13px;color:var(--muted);margin-bottom:7px}
  .field label .opt{color:var(--faint);font-weight:400}
  .field input,.field select,.field textarea{width:100%;font-family:var(--body);font-size:16px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:13px 15px;outline:none}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--cobalt);background:#fff}
  .field textarea{resize:vertical;min-height:60px;font-family:var(--body)}
  .field .mono{font-family:var(--mono);font-size:12px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px}
  .modal-actions{display:flex;gap:12px;margin-top:28px}
  .modal-actions.act-row{justify-content:flex-start;gap:8px;margin-top:0;flex-wrap:wrap}
  .modal-actions.act-row .btn{flex:0 0 auto;padding:10px 16px;font-size:13px;font-weight:600;white-space:nowrap}
  .hlp{border-bottom:1px solid var(--line)}
  .hlp summary{cursor:pointer;font-family:var(--display);font-weight:700;font-size:16px;padding:14px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}
  .hlp summary::-webkit-details-marker{display:none}
  .hlp summary::after{content:"+";font-weight:400;font-size:20px;color:var(--faint)}
  .hlp[open] summary::after{content:"–"}
  .hlp .hlp-b{padding:0 0 16px;font-size:14px;color:var(--muted);line-height:1.65}
  .hlp .hlp-b b{color:var(--ink)}
  .hlp .hlp-b p{margin:0 0 10px}
  .pd-row{padding:12px 0;border-bottom:1px solid var(--line)}
  .pd-k{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--faint);text-transform:uppercase;margin-bottom:4px}
  .pd-v{font-size:15px;color:var(--ink);overflow-wrap:anywhere;line-height:1.5}
  .pd-v.mono{font-family:var(--mono);font-size:14px}
  .modal-actions .btn{flex:1;justify-content:center;text-align:center;padding:14px;font-weight:700;font-size:15px}
  .modal-actions .btn.solid{flex:1.4}
  .err{color:var(--coral);font-size:13px;margin:-6px 0 6px;min-height:1px}
  .hint{font-size:12px;color:var(--faint);margin-top:-10px;margin-bottom:12px}

  /* share overlay */
  .share-scrim{position:fixed;inset:0;background:rgba(22,19,12,.6);backdrop-filter:blur(8px);display:none;align-items:safe center;justify-content:center;gap:24px;padding:24px;z-index:60;overflow:auto;animation:overlayIn .2s ease both}
  .share-scrim.show{display:flex}

    .two{grid-template-columns:1fr}

<div class="wrap">

</div>

<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>
<div class="share-scrim" id="shareScrim"><div id="shareInner" style="display:flex;gap:24px;align-items:center;flex-wrap:wrap;justify-content:center"></div></div>
<div class="auth-scrim" id="authScrim"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var PLANE='<svg width="ICON" height="ICON" viewBox="0 0 24 24" fill="none" style="STYLE"><path d="M2 11.5 21.5 3l-8.2 18.5-2.2-7.6-9.1-2.4Z" fill="currentColor"/></svg>';

  /* destination photos (new): keyed by IATA / code, generic fallback */
  var DEST_PHOTOS={
    FNC:"https://commons.wikimedia.org/wiki/Special:FilePath/Panorama_of_Funchal.jpg?width=1200",
    LIS:"https://images.unsplash.com/photo-1585208798174-6cedd86e019a?w=1000&q=80",
    OPO:"https://images.unsplash.com/photo-1555881400-74d7acaacd8b?w=1000&q=80",
    BCN:"https://images.unsplash.com/photo-1583422409516-2895a77efded?w=1000&q=80",
    GRU:"https://images.unsplash.com/photo-1543059080-f9b1272213d5?w=1000&q=80",
    ATH:"https://images.unsplash.com/photo-1555993539-1732b0258235?w=1000&q=80"

  function destPhoto(code,w){code=(code||"").trim().toUpperCase();var u=DEST_PHOTOS[code]||"https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=1000&q=80";
    if(w)u=u.replace(/width=\d+/,"width="+w).replace(/[?&]w=\d+/,function(m){return m[0]+"w="+w;});return u;}

  // page image, then the REST summary image. Only SUCCESSFUL results are cached,
  // so a transient miss retries next time.
  var photoCache={};
  async function wikiImage(name){
    try{
      var u="https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=1000&titles="+encodeURIComponent(name);
      var r=await fetch(u);
      if(r.ok){var d=await r.json();var pg=(d.query&&d.query.pages)||{};var f=pg[Object.keys(pg)[0]];var s=f&&f.thumbnail&&f.thumbnail.source;if(s)return s;}
    }catch(e){}
    try{
      var r2=await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(name));
      if(r2.ok){var d2=await r2.json();var s2=(d2.originalimage&&d2.originalimage.source)||(d2.thumbnail&&d2.thumbnail.source);if(s2)return s2;}
    }catch(e){}
    return"";
  }
  async function cityPhoto(name){
    name=(name||"").trim();if(!name)return"";
    var k=name.toLowerCase();
    if(photoCache[k])return photoCache[k];
    try{var ls=localStorage.getItem("photo2:"+k);if(ls)return(photoCache[k]=ls);}catch(e){}
    var url=await wikiImage(name);
    if(!url){                              // no photo for the exact place -> fall back to its country (e.g. Jurere Internacional -> Brazil)
      try{var g=await geoCity(name);if(g&&g.country)url=await wikiImage(g.country);}catch(e){}

  var CINFO={

  async function geoPlace(name){

      }else{

  async function fillDest(node,t){
    var g=await geoPlace(t.to);if(!g){node.innerHTML="";return;}
    var ci=CINFO[g.cc]||{},parts=[];
    var o=await geoPlace(t.from||home);          // no origin on the trip -> measure from home base
    if(o){var km=distKm(o,g);if(km>=1)parts.push('<span class="di">📏 '+fmtDist(km)+'</span>');}
    if(t.start&&t.end){var w=await weatherFor(g.lat,g.lon,t.start,t.end);if(w)parts.push('<span class="di">'+wIcon(w.code)+' '+fmtTemp(w.lo)+'-'+fmtTemp(w.hi)+tempUnit()+(w.typical?' <em>typical</em>':'')+'</span>');}
    if(ci.cur==="EUR"){parts.push('<span class="di">💶 Euro</span>');}
    else if(ci.cur){var fx=await fxRates();if(fx&&fx[ci.cur]){var pe=fx[ci.cur],pu=fx.USD?fx[ci.cur]/fx.USD:0;parts.push('<span class="di">💱 €1='+fmtMoney(pe)+' '+ci.cur+(pu?' · $1='+fmtMoney(pu):'')+'</span>');}else parts.push('<span class="di">💱 '+ci.cur+'</span>');}

  // Same-day plans order by their TIME, which lives in the note ("TP1328

  // Google Flights only parses q= reliably with explicit dates, so turn

  function wishWindow(w){
    var days=parseInt(w.days,10)||7;
    var mi=-1;if(w.month)mi=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"].indexOf(w.month.trim().toLowerCase().slice(0,3));

    if(mi>=0){start=new Date(today.getFullYear(),mi,5);if(start<=today)start=new Date(today.getFullYear()+1,mi,5);}
    else{start=new Date(today.getFullYear(),today.getMonth(),today.getDate()+30);}
    var end=new Date(start);end.setDate(end.getDate()+days);
    return {s:isoOf(start),e:isoOf(end)};
  }

  /* ===================== calendar overview (3 / 6 / 12 months) ===================== */
  function isoOf(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  var CAL_PAL=["var(--cobalt)","var(--coral)","var(--green)","var(--purple)","var(--amber)","var(--rail)"];
  function renderCalendar(){
    var dayInfo={};
    var sorted=trips.filter(function(t){return t.start&&t.end;}).sort(function(a,b){return a.start<b.start?1:-1;});
    sorted.forEach(function(t,i){
      var col=CAL_PAL[i%CAL_PAL.length],d=parse(t.start),end=parse(t.end),guard=0;
      while(d<=end&&guard<400){var iso=isoOf(d);if(!dayInfo[iso])dayInfo[iso]={color:col,label:(t.label||codeify(t.to)||"Trip")};d.setDate(d.getDate()+1);guard++;}
    });
    var now=new Date();now.setDate(1);now.setHours(0,0,0,0);
    var html='<div class="cal-toggle">'+[3,6,12].map(function(m){return '<button class="cal-tab'+(m===calMonths?' active':'')+'" data-cal="'+m+'">'+m+' months</button>';}).join('')+'</div><div class="cal-grid">';
    for(var mi=0;mi<calMonths;mi++)html+=monthCard(new Date(now.getFullYear(),now.getMonth()+mi,1),dayInfo);
    html+='</div>';
    // days away per calendar year (Jan 1 -> Dec 31). Header counts each calendar
    // day once (overlaps deduped); tap a year to see exactly which trips and dates
    // make it up - so a wrong stored date shows itself immediately.
    var dayset={};
    trips.forEach(function(t){if(!t.start||!t.end)return;var d=parse(t.start),end=parse(t.end),guard=0;while(d<=end&&guard<800){dayset[isoOf(d)]=1;d.setDate(d.getDate()+1);guard++;}});
    var yearCount={};Object.keys(dayset).forEach(function(iso){var y=iso.slice(0,4);yearCount[y]=(yearCount[y]||0)+1;});
    var years=Object.keys(yearCount).sort().reverse();
    if(years.length){
      var maxY=Math.max.apply(null,years.map(function(y){return yearCount[y];}));
      var clipYear=function(t,y){var ys=y+"-01-01",ye=y+"-12-31";var s=t.start<ys?ys:t.start,e=t.end>ye?ye:t.end;if(s>e)return null;return{s:s,e:e,days:dayDiff(s,e)+1};};
      var yhtml=years.map(function(y){
        var n=yearCount[y],pct=Math.max(4,Math.round(n/maxY*100));
        var parts=trips.filter(function(t){return t.start&&t.end;}).map(function(t){return{t:t,c:clipYear(t,y)};}).filter(function(x){return x.c;}).sort(function(a,b){return a.c.s<b.c.s?-1:1;});
        var rows=parts.map(function(x){
          var route=(x.t.from?esc(codeify(x.t.from))+' → ':'')+esc(codeify(x.t.to));
          var spans=x.t.start<y+"-01-01"||x.t.end>y+"-12-31";
          return '<div class="yr-trip"><span class="yr-tr">'+route+'</span><span class="yr-td">'+fmtRange(x.t.start,x.t.end)+' · '+x.c.days+'d'+(spans?' in '+y:'')+'</span></div>';
        }).join('');
        return '<div class="yr"><div class="yr-top" data-yr="'+y+'"><span class="yr-y">'+y+' <span class="yr-caret">▸</span></span><span class="yr-n">'+n+' day'+(n===1?'':'s')+' away</span></div><div class="yr-bar"><span style="width:'+pct+'%"></span></div><div class="yr-detail">'+(rows||'<div class="yr-trip"><span class="yr-tr">No trips</span></div>')+'</div></div>';
      }).join('');
      html+='<div class="yr-wrap"><div class="yr-lh">Days away by year <span class="yr-hint">— tap a year for the breakdown</span></div>'+yhtml+'</div>';
    }
    var legend=sorted.map(function(t,i){
      var col=CAL_PAL[i%CAL_PAL.length],route=(t.from?esc(codeify(t.from))+' → ':'')+esc(codeify(t.to));
      return '<div class="cal-leg"><span class="sw" style="background:'+col+'"></span>'+route+'<span class="dt">'+fmtRange(t.start,t.end)+'</span></div>';
    }).join('');
    html+=legend?'<div class="cal-legend"><div class="cal-lh">Your Trips</div>'+legend+'</div>':'<div class="empty-state" style="margin-top:18px"><div class="h">Nothing booked yet</div><p>Add a trip and the days you’re away light up across the months.</p></div>';
    document.getElementById("list").innerHTML=html;
    document.querySelectorAll(".cal-tab").forEach(function(b){b.onclick=function(){calMonths=+b.dataset.cal;render();};});
    document.querySelectorAll(".yr-top").forEach(function(b){b.onclick=function(){b.parentNode.classList.toggle("open");};});
  }
  function monthCard(mDate,dayInfo){
    var y=mDate.getFullYear(),m=mDate.getMonth();
    var off=(new Date(y,m,1).getDay()+6)%7,daysIn=new Date(y,m+1,0).getDate(),todayIso=todayISO();
    var dow=["Mo","Tu","We","Th","Fr","Sa","Su"].map(function(x){return '<div class="cal-dow">'+x+'</div>';}).join('');
    var cells='';for(var i=0;i<off;i++)cells+='<div class="cal-d empty"></div>';
    for(var dd=1;dd<=daysIn;dd++){
      var iso=y+"-"+String(m+1).padStart(2,"0")+"-"+String(dd).padStart(2,"0"),info=dayInfo[iso];
      var cls="cal-d"+(info?" trav":"")+(iso===todayIso?" today":"");
      cells+='<div class="'+cls+'"'+(info?' style="--c:'+info.color+'" title="'+esc(info.label)+'"':'')+'>'+dd+'</div>';
    }
    return '<div class="cal-month"><div class="cal-mh">'+MON[m]+' '+y+'</div><div class="cal-days">'+dow+cells+'</div></div>';
  }

  function mapProj(lon,lat){return [(lon+180)/360*1000,(90-lat)/180*500];}
  function flagEmoji(cc){if(!cc||cc.length!==2)return"🌍";try{return String.fromCodePoint.apply(null,cc.toUpperCase().split("").map(function(c){return 0x1F1E6+c.charCodeAt(0)-65;}));}catch(e){return"🌍";}}
  async function renderMap(){
    var listEl=document.getElementById("list");
    listEl.innerHTML='<div class="map-loading">Charting your travels…</div>';
    var today=todayISO(),visited={};
    for(var i=0;i<trips.length;i++){var t=trips[i];if(!t.to||!t.start)continue;if(dayDiff(today,t.start)>0)continue;
      var g=await geoCity(t.to);if(!g||!g.cc)continue;var cc=g.cc.toLowerCase();
      if(!visited[cc])visited[cc]={count:0,country:g.country||t.to,lat:g.lat,lon:g.lon,cc:cc};
      visited[cc].count++;}
    var ccs=Object.keys(visited);
    if(!ccs.length){listEl.innerHTML='<div class="empty-state"><div class="h">No stamps yet</div><p>Once a trip’s start date has passed, that country lights up here with a visit count.</p></div>';return;}
    var maxc=1;ccs.forEach(function(c){if(visited[c].count>maxc)maxc=visited[c].count;});
    var base="";for(var k in WORLD_PATHS){if(!WORLD_PATHS.hasOwnProperty(k))continue;var v=visited[k];var fill=v?"var(--cobalt)":"#dcd5c6";var op=v?(0.45+0.55*(v.count/maxc)).toFixed(2):"1";base+='<path d="'+WORLD_PATHS[k]+'" fill="'+fill+'" fill-opacity="'+op+'" stroke="#ECE7DC" stroke-width="0.6"/>';}
    var badges="";ccs.forEach(function(c){var v=visited[c];if(v.lat==null||v.lon==null)return;var p=mapProj(v.lon,v.lat);badges+='<g class="mk"><circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="9" fill="var(--coral)" stroke="#fff" stroke-width="1.5"></circle><text x="'+p[0].toFixed(1)+'" y="'+(p[1]+3.3).toFixed(1)+'" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">'+v.count+'</text></g>';});
    var totalVisits=ccs.reduce(function(a,c){return a+visited[c].count;},0);
    var svg='<svg class="worldmap" viewBox="0 8 1000 415" preserveAspectRatio="xMidYMid meet">'+base+badges+'</svg>';
    var sorted=ccs.map(function(c){return visited[c];}).sort(function(a,b){return b.count-a.count||a.country.localeCompare(b.country);});
    var chips=sorted.map(function(v){return '<div class="mc"><span class="fl">'+flagEmoji(v.cc)+'</span><span class="nm">'+esc(v.country)+'</span><span class="ct">×'+v.count+'</span></div>';}).join("");
    var head='<div class="map-stat"><b>'+ccs.length+'</b> countr'+(ccs.length===1?'y':'ies')+' · <b>'+totalVisits+'</b> visit'+(totalVisits===1?'':'s')+'</div>';
    listEl.innerHTML='<div class="map-wrap">'+svg+'</div>'+head+'<div class="map-chips">'+chips+'</div>';
  }

  function render(){
    renderHero();
    renderStats();
    document.getElementById("listTitle").textContent=tab==="upcoming"?"Upcoming":tab==="past"?"Past":tab==="map"?"Been there":tab==="timeline"?"Where I’m headed":"Calendar";
    document.getElementById("addBtn").style.display=(tab==="calendar"||tab==="map"||tab==="timeline")?"none":"";
    document.getElementById("addBtn").textContent="+ Add trip";
    var list=document.getElementById("list");
    if(tab==="map"){renderMap();return;}
    if(tab==="timeline"){renderTimeline();return;}
    if(tab==="calendar"){renderCalendar();hydratePhotos();return;}
    var up=trips.filter(isUpcoming).sort(byStart);
    var past=trips.filter(function(t){return!isUpcoming(t);}).sort(function(a,b){return a.start>b.start?-1:1;});
    if(tab==="upcoming")list.innerHTML=up.length?up.map(tripCard).join(""):emptyState("Nothing on the horizon","Add your next trip to start the countdown.");
    else list.innerHTML=past.length?past.map(tripCard).join(""):emptyState("No memories yet","When a trip wraps, it slides here with its photos, receipts and the route you actually flew.");
    hydratePhotos();hydrateDest();
  }
  /* Timeline tab - the horizontal "where I'm headed" strip, upcoming trips only. */
  function renderTimeline(){
    var list=document.getElementById("list");
    var up=trips.filter(isUpcoming).sort(byStart);
    var nodes=up.map(function(t,i){
      return '<div class="tl-node '+(i%2===0?"up":"down")+'">'+
        '<div class="tl-card"><div class="tl-city">'+esc(codeify(t.to))+'</div>'+
          '<div class="tl-date">'+esc(fmtRange(t.start,t.end))+'</div>'+
          '<div class="tl-days">'+duration(t.start,t.end)+'d</div></div>'+
        '<span class="tl-dot"></span></div>';
    }).join("");
    var totalDays=up.reduce(function(a,t){return a+duration(t.start,t.end);},0);
    var body=up.length
      ? '<div class="tl-scroll"><div class="tl" style="min-width:'+Math.max(up.length*150,520)+'px"><span class="tl-line"></span>'+nodes+'</div></div>'
      : '<div class="tl-empty">No upcoming trips yet — add one and it lands here on your timeline.</div>';
    list.innerHTML='<div class="tl-panel">'+
      '<div class="tl-head"><div class="tl-title">Where I’m<br>headed</div>'+
        '<div class="tl-sub">'+up.length+' trip'+(up.length===1?"":"s")+' · '+totalDays+' days ahead</div></div>'+
      body+'</div>';
  }
  function emptyState(h,p){return '<div class="empty-state"><div class="h">'+esc(h)+'</div><p>'+esc(p)+'</p><button class="add" onclick="document.getElementById(\'addBtn\').click()">+ Add now</button></div>';}

  function setActiveTab(){document.querySelectorAll(".tab").forEach(function(x){x.classList.toggle("active",x.dataset.tab===tab);});}

  /* ===================== modal system (new look) ===================== */
  var scrim=document.getElementById("scrim"),modal=document.getElementById("modal");
  function openModal(html){modal.innerHTML=html;scrim.classList.add("show");}
  function closeModal(){scrim.classList.remove("show");}
  scrim.addEventListener("click",function(e){if(e.target===scrim)closeModal();});

  function field(label,id,type,val,ph,opt){return '<div class="field"><label>'+label+(opt?' <span class="opt">'+opt+'</span>':'')+'</label><input id="'+id+'" type="'+type+'" value="'+esc(val==null?"":val)+'" placeholder="'+esc(ph)+'"></div>';}
  function val(id){var el=document.getElementById(id);return el?el.value.trim():"";}
  function ensureIds(){trips.forEach(function(t){if(!t.id)t.id=uid();(t.segments||[]).forEach(function(s){if(!s.sid)s.sid=uid();});});}

  /* ---- segment (plan) form ---- */
  function segForm(s){
    var types=[["flight","Flight"],["hotel","Hotel / stay"],["car","Rental car"],["ride","Ride / transfer"],["rail","Train"],["other","Other"]];
    var opts=types.map(function(p){return '<option value="'+p[0]+'"'+(s.type===p[0]?' selected':'')+'>'+p[1]+'</option>';}).join("");
    var showConf=s.conf&&String(s.conf).indexOf("seed")!==0&&String(s.conf).indexOf("man:")!==0?s.conf:"";
    return '<h3>'+(s.sid?"Edit plan":"Add plan")+'</h3>'+
      '<div class="field"><label>Type</label><select id="g_type">'+opts+'</select></div>'+
      field("Name","g_name","text",s.name,"TAP TP1693 OPO to FNC")+
      field("Address","g_addr","text",s.address,"Rua do Castanheiro 31, Funchal","(optional)")+
      field("Details","g_note","text",s.note,"Door code 4821# \u00b7 check-in 15:00 \u00b7 TP1479 OPO-LIS 07:10","(optional)")+
      '<div class="two">'+field("Start","g_start","date",s.start,"")+field("End","g_end","date",s.end,"","(optional)")+'</div>'+
      field("Confirmation","g_conf","text",showConf,"","(optional)")+
      '<div class="err" id="gerr"></div>'+
      '<div class="modal-actions"><button class="btn" id="cancelBtn">Cancel</button><button class="btn solid" id="saveSeg">'+(s.sid?"Save plan":"Add plan")+'</button></div>';
  }
  /* Plan detail: tap a row, get the traveller view - details, address, maps link. */
  function openPlan(tripId,sid){
    var tr=trips.find(function(x){return x.id===tripId;});if(!tr)return;
    var s=(tr.segments||[]).find(function(x){return x.sid===sid;});if(!s)return;
    var cc=cat(s.type);
    var when=s.start?(fmtSeg(s.start)+(s.end&&s.end!==s.start?" \u2013 "+fmtSeg(s.end):"")):"";
    var raw=s.address||"";
    var urlM=raw.match(/https?:\/\/\S+/);
    var addrText=raw.replace(/https?:\/\/\S+/g,"").replace(/[-\u2013\u00b7|,\s]+$/,"").trim();
    var mapsUrl=urlM?urlM[0]:(addrText?"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(addrText):"");
    var showConf=s.conf&&!/^(man:|seed|gcal:)/.test(String(s.conf))?s.conf:"";
    openModal('<h3 style="margin-bottom:6px">'+esc(s.name||"Plan")+'</h3>'+
      '<div class="chips" style="margin-bottom:10px"><span class="type" style="color:'+cc.c+';background:'+cc.t+'">'+esc(s.type||"plan")+'</span>'+(when?'<span class="c-date">'+when+'</span>':'')+'</div>'+
      (s.note?'<div class="pd-row"><div class="pd-k">Details</div><div class="pd-v">'+esc(s.note)+'</div></div>':'')+
      (addrText?'<div class="pd-row"><div class="pd-k">Address</div><div class="pd-v">'+esc(addrText)+'</div></div>':'')+
      (showConf?'<div class="pd-row"><div class="pd-k">Confirmation</div><div class="pd-v mono">'+esc(showConf)+'</div></div>':'')+
      '<div class="modal-actions">'+
        (mapsUrl?'<a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="'+esc(mapsUrl)+'" target="_blank" rel="noopener">\ud83d\uddfa\ufe0f Maps</a>':'')+
        '<button class="btn" id="pd_edit">Edit</button><button class="btn solid" id="pd_close">Close</button></div>');
    document.getElementById("pd_close").onclick=closeModal;
    document.getElementById("pd_edit").onclick=function(){openSeg(tripId,sid);};
  }
  function openSeg(tripId,sid){
    var tr=trips.find(function(x){return x.id===tripId;});if(!tr)return;
    var s=sid?(tr.segments||[]).find(function(x){return x.sid===sid;}):{};
    modal.dataset.segTrip=tripId;modal.dataset.segSid=sid||"";
    openModal(segForm(s||{}));
    document.getElementById("cancelBtn").onclick=closeModal;
    document.getElementById("saveSeg").onclick=saveSeg;
  }
  async function saveSeg(){
    var tripId=modal.dataset.segTrip,sid=modal.dataset.segSid;
    var tr=trips.find(function(x){return x.id===tripId;});if(!tr)return;

  async function delSeg(tripId,sid){
    if(!confirm("Delete this plan? It will not come back on the next sync."))return;
    var tr=trips.find(function(x){return x.id===tripId;});if(!tr)return;
    var seg=(tr.segments||[]).find(function(x){return x.sid===sid;});
    tr.segments=(tr.segments||[]).filter(function(x){return x.sid!==sid;});
    // Tell the worker to REMEMBER this deletion (tombstone by conf) so no sync -
    // calendar, Gmail, re-import - ever re-adds it. Manual plans go through
    // the same path. Falls back to a plain trip save in local mode.
    if(settings.workerUrl){
      try{await fetch(settings.workerUrl+"/segments/delete",{method:"POST",headers:Object.assign({"Content-Type":"application/json"},authHeaders()),body:JSON.stringify({tripId:tripId,sid:sid,conf:seg&&seg.conf})});}
      catch(e){}
    }
    await save("trips",trips);render();toast("Plan removed - it won't come back");
  }

  // Companion link: the worker mints a private read-only URL for this one trip.

    // ONE tap does the whole job: (optionally clean first,) re-scan, then keep
    // running sync passes until the inbox is drained. Drained = a pass marked
    // fewer than the worker's 10-email budget as seen (read from /google/test),
    // so nobody has to count passes or press anything twice.
    async function inboxPipeline(clean){
      var btnIds=["gSave","gConnect","gTest","gRescan","gReset","gTrace","gClear"],i,el;
      for(i=0;i<btnIds.length;i++){el=document.getElementById(btnIds[i]);if(el)el.disabled=true;}
      try{
        if(clean){
          setGStatus('Removing auto-imported plans…');
          var rr=await fetch(apiBase()+"/plans/reset",{method:"POST",headers:authHeaders()});
          var dd=await rr.json().catch(function(){return{};});
          if(!rr.ok){setGStatus('<span style="color:var(--coral)">○ '+esc(dd.error||"Could not clean")+'</span>');return;}
          setGStatus('Removed '+(dd.removed||0)+' imported plan'+(dd.removed===1?'':'s')+' — re-importing fresh…');
          await refresh();
        }else{
          setGStatus('Re-reading the last year of email from scratch…');
          var r0=await fetch(apiBase()+"/gmail/rescan",{method:"POST",headers:authHeaders()});
          if(!r0.ok){setGStatus('<span style="color:var(--coral)">○ Could not start the re-scan</span>');return;}
        }
        // Pass 1 is a full sync (calendar + email); every pass after that
        // is a cheap email-only sync, so the Worker's outbound-call cap can
        // never starve the parser again. The worker reports how many matching
        // emails are STILL unread after each pass - we loop until that is 0.
        var before=planCount(),newPlans=0,newTrips=0,pass=0,MAX=12,drained=false,parserDown=false,left=null,g=null;
        while(pass<MAX){
          pass++;
          setGStatus('Sync pass '+pass+(left!==null?' — '+left+' emails still queued':' — reading new emails')+'… <span class="opt">'+
            (newPlans||newTrips?'('+(newTrips?newTrips+' new trip'+(newTrips>1?'s':'')+', ':'')+newPlans+' new plan'+(newPlans===1?'':'s')+' so far)':'(you can close this — the rest finishes by itself in the background)')+'</span>');
          var stats=null;
          try{var sr=await fetch(apiBase()+"/sync"+(pass>1?"?only=gmail":""),{method:"POST",headers:authHeaders()});stats=await sr.json();}catch(e){}
          await refresh();
          var after=planCount();
          newPlans+=Math.max(0,after.plans-before.plans);newTrips+=Math.max(0,after.trips-before.trips);before=after;
          g=stats&&stats.gmail;
          if(g){left=g.remaining;
            if(g.remaining===0){drained=true;break;}
            if(g.failed>0&&g.parsed===0){parserDown=true;break;}   // parser unreachable - more passes won't help
          }
          // g missing (stage crashed mid-pass): keep going, the next email-only pass is cheap
        }
        var bits=[];
        if(newTrips)bits.push(newTrips+' new trip'+(newTrips>1?'s':''));
        if(newPlans)bits.push(newPlans+' new plan'+(newPlans>1?'s':''));
        var out=drained
          ?'<span style="color:var(--green)">● Done after '+pass+' pass'+(pass>1?'es':'')+' — '+(bits.length?bits.join(', '):'nothing new found')+'. Every matching email has been read.</span>'
          :'<span style="color:var(--amber)">◐ Stopped after '+pass+' pass'+(pass>1?'es':'')+' — '+(bits.length?bits.join(', '):'nothing new yet')+'.</span>';
        if(parserDown)out+='<br><span style="color:var(--coral)">○ The email parser could not be reached — check the Anthropic API key under Email parsing, then tap Re-scan inbox again.</span>';
        else if(!drained)out+='<br><span style="color:var(--amber)">◐ '+(left!==null?left+' matching emails still queued':'The inbox may hold more')+' — no action needed: they import automatically in the background over the next hours. (Tap Re-scan inbox to finish now instead.)</span>';
        if(g&&g.unfiled>0){

            uf.map(function(u){return esc(u.name)+' ('+esc(u.start)+(u.end&&u.end!==u.start?' – '+esc(u.end):'')+')';}).join(' · ')+
            '</span> — create or widen a trip around those dates, then tap Re-scan inbox once more.';
        }
        setGStatus(out);
        toast(bits.length?('Inbox imported — '+bits.join(', ')+' ✓'):(drained?'Inbox scanned — nothing new found':'Scan stopped early — see Settings for why'));
      }catch(e){setGStatus('<span style="color:var(--faint)">Worker not reachable.</span>');}
      finally{for(i=0;i<btnIds.length;i++){el=document.getElementById(btnIds[i]);if(el)el.disabled=false;}}
    }

  function doImport(raw){var err=document.getElementById("imperr");if(err)err.textContent="";var data;try{data=JSON.parse(raw);}catch(e){if(err)err.textContent="Not valid JSON.";return;}

  function authHeaders(){ return authToken ? {"X-Auth":authToken} : {}; }
  var authScrim=document.getElementById("authScrim");
  // Log out on this device: clear the server session cookie + local token/cache,
  // then let refresh() hit /trips (now 401) and show the sign-in wall.
  async function doLogout(){
    var base=settings.workerUrl||location.origin;
    try{ await fetch(base+"/auth/logout",{method:"POST",headers:authHeaders()}); }catch(e){}
    authToken="";
    try{ localStorage.removeItem("travel:auth"); localStorage.removeItem("travel:trips"); }catch(e){}
    trips=[]; closeModal(); render();
    if(settings.workerUrl){ toast("Signed out"); await refresh(); }
    else { location.reload(); }
  }
  // Session token is kept for 30 days, then a fresh sign-in is asked for.
  function saveAuth(token){ try{localStorage.setItem("travel:auth",JSON.stringify({token:token,exp:Date.now()+30*86400000}));}catch(e){} }
  function loadAuth(){
    try{
      var raw=localStorage.getItem("travel:auth");if(!raw)return"";
      var o=null;try{o=JSON.parse(raw);}catch(e){}
      if(o&&o.token)return(o.exp&&o.exp<Date.now())?"":o.token;   // expired -> require sign-in
      return raw;                                                  // legacy plain token
    }catch(e){return"";}
  }
  function showAuth(mode){
    return new Promise(function(resolve){
      var create=mode==="create";
      authScrim.innerHTML=
        '<div class="auth-card"><div class="auth-mark">'+plane(30,"color:var(--coral)")+'</div>'+
        '<h2>'+(create?"Set up your hub":"Welcome back")+'</h2>'+
        '<p>'+(create?"Create your login - email and a password. You’ll use it on each device.":"Sign in to unlock your travel hub.")+'</p>'+
        '<input id="authEmail" type="email" placeholder="Email" autocomplete="email" inputmode="email">'+
        '<input id="authInput" type="password" placeholder="Password" autocomplete="'+(create?"new-password":"current-password")+'" style="margin-top:10px">'+
        '<div class="auth-err" id="authErr"></div>'+
        '<button class="btn solid" id="authBtn">'+(create?"Create login":"Sign in")+'</button>'+
        '<div class="auth-foot">Stays signed in for 30 days on this device.</div></div>';
      authScrim.classList.add("show");
      var email=document.getElementById("authEmail"),input=document.getElementById("authInput"),btn=document.getElementById("authBtn"),err=document.getElementById("authErr");
      setTimeout(function(){email.focus();},50);
      async function submit(){
        var em=email.value.trim(),pw=input.value;
        if(!em){err.textContent="Enter your email";return;}
        if(!pw){err.textContent="Enter a password";return;}
        btn.disabled=true;err.textContent="";
        try{
          var res=await fetch(settings.workerUrl+"/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:em,password:pw})});
          if(res.ok){var d=await res.json();authToken=d.token;saveAuth(authToken);authScrim.classList.remove("show");resolve(true);return;}
          err.textContent=create?"Could not set up - try again":"Wrong email or password";
        }catch(e){err.textContent="Network error - try again";}
        btn.disabled=false;
      }
      btn.onclick=submit;
      email.onkeydown=function(e){if(e.key==="Enter")input.focus();};
      input.onkeydown=function(e){if(e.key==="Enter")submit();};
    });
  }
  async function ensureAuth(){
    if(!settings.workerUrl)return;
    authToken=loadAuth();
    var st;
    try{st=await fetch(settings.workerUrl+"/auth/status");}catch(e){return;}
    if(!st.ok)return;                                 // old worker without auth -> no gate
    var d=await st.json();
    if(!d.set){await showAuth("create");return;}      // first time: set up email + password
    // Already set: don't force a login here. The session cookie (or stored token)
    // may already authenticate us; refresh() prompts only if /trips returns 401.
  }

  async function refresh(){
    if(!settings.workerUrl){syncState="local";updateStatusChip();render();return;}
    try{
      var res=await fetch(settings.workerUrl+"/trips",{headers:Object.assign({Accept:"application/json"},authHeaders())});
      if(res.status===401){await showAuth("login");return refresh();}
      if(!res.ok)throw new Error("bad status");
      var data=await res.json();
      trips=(Array.isArray(data)?data:(data.trips||[])).map(function(t){return{id:t.id||uid(),from:t.from||"",to:t.to||"",start:norm(t.start),end:norm(t.end),label:t.label||"",notes:t.notes||"",segments:t.segments||[],photo:t.photo||"",calEventId:t.calEventId};});
      ensureIds();
      await save("trips",trips);syncState="synced";
    }catch(e){syncState="offline";}
    updateStatusChip();render();
  }
  async function persistTrip(t,mode){
    await save("trips",trips);
    if(!settings.workerUrl)return;
    try{await fetch(settings.workerUrl+"/trips",{method:"POST",headers:Object.assign({"Content-Type":"application/json"},authHeaders()),body:JSON.stringify(t)});}catch(e){}
  }
  function updateStatusChip(){
    // The chip lives INSIDE Settings now (the header row wrapped awkwardly on
    // phones with five items), so it only exists while that modal is open.
    var el=document.getElementById("status");
    if(el){
      el.className="status "+(syncState==="synced"?"synced":syncState==="offline"?"offline":"local");
      el.innerHTML='<span class="dot"></span>'+(syncState==="synced"?"Synced":syncState==="offline"?"Offline":"Local");
    }
    document.getElementById("refreshBtn").style.display=settings.workerUrl?"":"none";
  }
  // Sync now: ask the worker to pull from Calendar/Gmail, then reload the store.
  function planCount(){var s=0;trips.forEach(function(t){s+=(t.segments||[]).length;});return{trips:trips.length,plans:s};}
  async function syncNow(){
    if(!settings.workerUrl){toast("Local mode - set a worker URL in Settings to sync");return;}
    var b=document.getElementById("refreshBtn"),old=b?b.textContent:"";
    if(b){b.textContent="Syncing\u2026";b.disabled=true;}
    toast("Syncing \u2014 calendar & email\u2026 this can take a minute");
    var before=planCount();
    try{await fetch(settings.workerUrl+"/sync",{method:"POST",headers:authHeaders()});}catch(e){}
    await refresh();
    if(b){b.disabled=false;b.textContent=old;}
    var after=planCount(),bits=[];
    if(after.trips>before.trips)bits.push((after.trips-before.trips)+" new trip"+(after.trips-before.trips>1?"s":""));
    if(after.plans>before.plans)bits.push((after.plans-before.plans)+" new plan"+(after.plans-before.plans>1?"s":""));
    toast(bits.length?("Sync done \u2014 "+bits.join(", ")+" \u2713"):"Sync done \u2014 nothing new this time");
  }
  document.getElementById("refreshBtn").onclick=syncNow;

  /* ===================== init (preserved seeding) ===================== */
  // When served from the worker itself, adopt its own origin as the sync URL so
  // the user never pastes anything. Stays local on a static-only host or file://.
  async function probeOrigin(){
    if(settings.workerUrl)return;                     // an explicit URL always wins
    if(location.protocol.indexOf("http")!==0)return;  // file:// -> stay local
    try{
      var c=new AbortController(),to=setTimeout(function(){c.abort();},4000);
      var res=await fetch(location.origin+"/auth/status",{signal:c.signal});  // unauthenticated worker check
      clearTimeout(to);
      if(res.ok)settings.workerUrl=location.origin;   // not persisted: always reflects where it is served
    }catch(e){}
  }
  (async function(){
    trips=await load("trips",null);wishes=await load("wishes",null);home=await load("home",null);settings=await load("settings",null)||{workerUrl:""};
    var firstRun=(trips===null&&wishes===null);
    if(trips===null)trips=[];if(wishes===null)wishes=[];if(!home)home="OPO";
    await probeOrigin();
    // Seed the sample trip only in pure local mode; when synced the worker store is the source of truth.
    if(firstRun && !settings.workerUrl){
      trips=[{id:uid(),from:"OPO",to:"FNC",start:"2026-09-15",end:"2026-09-18",label:"Build Days - Madeira",segments:[
        {type:"flight",name:"TAP TP1693 OPO to FNC",start:"2026-09-15",address:"Porto to Funchal",conf:"seed1"},
        {type:"hotel",name:"Castanheiro Boutique Hotel",start:"2026-09-15",end:"2026-09-18",address:"Rua do Castanheiro 31, Funchal",conf:"seed2"},
        {type:"ride",name:"Airport pickup",start:"2026-09-15",address:"FNC arrivals",conf:"seed3"},
        {type:"flight",name:"TAP TP1694 FNC to OPO",start:"2026-09-18",address:"Funchal to Porto",conf:"seed4"}
      ]}];
      wishes=[{id:uid(),from:"OPO",dest:"",days:"5",month:"August",budget:"€400",note:"Anywhere warm, flexible dates, direct if possible."}];
      openSet[trips[0].id]=true;
      save("trips",trips);save("wishes",wishes);save("home",home);
    }
    ensureIds();
    updateStatusChip();
    if(settings.workerUrl){
      render();
      await ensureAuth();                 // password gate (synced mode)
      await refresh();
      if(!trips.length)await syncNow();   // first open against an empty store: auto-pull from Calendar
    }else{render();}
  })();
})();
</script>
<script>
  // Register the service worker for offline + installability (only over http/https).
  if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
    window.addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").catch(function(){});});
  }
</script>
