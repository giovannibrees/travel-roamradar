name: Deploy website to GitHub Pages

# Publishes the static marketing site in website/ to GitHub Pages, giving the
# project an indexable landing page at https://giovannibrees.github.io/travel-roamradar/
# (or your custom domain). One-time setup: repo Settings -> Pages -> Source:
# "GitHub Actions". The Cloudflare Worker app deploys separately and is unaffected.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
